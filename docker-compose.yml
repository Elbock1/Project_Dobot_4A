version: '3.8'

services:
  app:
    build: .
    container_name: dobot_ai_app
    restart: unless-stopped
    network_mode: "host" # Indispensable pour l'accès fluide Wi-Fi hotspot et caméras
    privileged: true
    devices:
      - "/dev/ttyUSB0:/dev/ttyUSB0"
      - "/dev/video0:/dev/video0"
    environment:
      - DOBOT_PORT=/dev/ttyUSB0
      - MOCK_ROBOT=false
      - FLASK_PORT=5000
    volumes:
      - ./config:/workspace/config
      - ./models:/workspace/models
      - ./datasets:/workspace/datasets
    depends_on:
      - llm

  llm:
    image: ghcr.io/ggerganov/llama.cpp:server
    container_name: dobot_ai_llm
    restart: unless-stopped
    command: >
      -m /models/qwen2.5-1.5b-instruct-q4_k_m.gguf
      --host 0.0.0.0
      --port 8080
      -c 2048
      --threads 4
    volumes:
      - ./models:/models
    ports:
      - "8080:8080"
